<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>制冷方向《专业英语》复习网站</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280;
    --primary:#2563eb; --primary-dark:#1d4ed8;
    --success:#15803d; --success-bg:#dcfce7;
    --error:#b91c1c; --error-bg:#fee2e2;
    --info:#1d4ed8; --info-bg:#dbeafe;
    --border:#e5e7eb; --soft:#f1f5f9; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    line-height:1.6;}
  .app-header{max-width:860px;margin:0 auto;padding:28px 18px 12px;text-align:center}
  .app-header h1{margin:0 0 16px;font-size:26px;letter-spacing:.5px}
  .mode-switch{display:inline-flex;gap:8px;padding:5px;background:#e8eef8;border-radius:999px}
  .mode-btn{border:none;background:transparent;color:#334155;padding:9px 20px;border-radius:999px;font-size:15px;cursor:pointer}
  .mode-btn.active{background:var(--card);color:var(--primary);font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.08)}
  main{max-width:860px;margin:0 auto;padding:12px 18px 40px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(15,23,42,.06);padding:22px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border);color:var(--muted);font-size:14px}
  .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .random-label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none}
  .label{margin:0 0 10px;color:var(--muted);font-size:14px}
  .meaning-main{min-height:64px;display:flex;align-items:center;justify-content:center;padding:14px 16px;margin-bottom:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;color:#9a3412;font-size:clamp(20px,4vw,28px);font-weight:700;text-align:center;word-break:break-word}
  .phonetic-tip{margin:10px 0;padding:12px 14px;background:var(--soft);border-radius:12px;color:#0f172a;font-size:20px;font-weight:700;text-align:center;word-break:break-word}
  .answer-tip{margin:10px 0;padding:12px 14px;background:#ecfdf5;border:1px solid #bbf7d0;border-radius:12px;color:#166534;font-size:20px;font-weight:700;text-align:center;word-break:break-word}
  input[type=text]{width:100%;margin-top:14px;padding:14px 16px;border:2px solid var(--border);border-radius:12px;outline:none;font-size:18px;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s}
  input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
  input[type=text]:disabled{background:#f8fafc;color:#94a3b8}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{font-family:inherit}
  .primary,.secondary,.ghost{border:none;border-radius:11px;padding:11px 18px;font-size:15px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .primary{background:var(--primary);color:#fff;font-weight:700}
  .primary:hover{background:var(--primary-dark)}
  .secondary{background:#eef4ff;color:var(--primary);font-weight:600}
  .secondary:hover{background:#dbeafe}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .ghost:hover{background:#f8fafc;color:var(--text)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .feedback{min-height:28px;margin-top:12px;font-size:15px;font-weight:600}
  .feedback.success{color:var(--success);background:var(--success-bg);padding:9px 12px;border-radius:10px}
  .feedback.error{color:var(--error);background:var(--error-bg);padding:9px 12px;border-radius:10px}
  .feedback.info{color:var(--info);background:var(--info-bg);padding:9px 12px;border-radius:10px}
  .english{margin:0 0 16px;padding:16px;background:var(--soft);border-radius:14px;color:#0f172a;font-size:18px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .translation{margin-top:14px;padding:15px 16px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;color:#166534;font-size:16px;line-height:1.85;white-space:pre-wrap}
  .summary{text-align:center;padding:22px 8px 10px}
  .summary h2{margin:0 0 10px;font-size:24px}
  .summary p{margin:0 0 18px;color:var(--muted);font-size:16px}
  .hidden{display:none!important}
  .site-footer{max-width:860px;margin:0 auto;padding:0 18px 28px;text-align:center;color:#94a3b8;font-size:13px}
  @media(max-width:560px){
    .app-header{padding-top:20px}
    .app-header h1{font-size:21px}
    .card{padding:16px}
    .mode-btn{padding:8px 14px;font-size:14px}
    .primary,.secondary,.ghost{width:100%}
    .actions{flex-direction:column}
    .english{font-size:16px}
  }
</style>
</head>
<body>
<header class="app-header">
  <h1>制冷方向《专业英语》复习网站</h1>
  <div class="mode-switch">
    <button id="modeSpelling" class="mode-btn active" type="button">单词拼写</button>
    <button id="modeTranslation" class="mode-btn" type="button">语料翻译</button>
  </div>
</header>

<main>
  <section id="spellingSection" class="card">
    <div class="toolbar">
      <div class="toolbar-left"><span id="spellProgress">第 1 / 1 个</span></div>
      <div class="toolbar-right">
        <label class="random-label"><input id="randomToggle" type="checkbox" /> 随机顺序</label>
        <button class="ghost reset-progress" type="button">重置进度</button>
      </div>
    </div>

    <div id="spellPlayArea">
      <p class="label">请根据中文释义拼写英文单词：</p>
      <div id="meaningMain" class="meaning-main"></div>

      <div id="phoneticTip" class="phonetic-tip hidden"></div>
      <div id="answerTip" class="answer-tip hidden"></div>

      <input id="spellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入单词后按回车" />

      <div class="actions">
        <button id="submitSpell" class="primary" type="button">提交</button>
        <button id="showPhonetic" class="secondary" type="button">查看音标提示</button>
        <button id="showAnswer" class="secondary" type="button">查看答案</button>
        <button id="prevSpell" class="ghost" type="button">上一个</button>
        <button id="nextSpell" class="ghost" type="button">下一个</button>
      </div>

      <div id="feedback" class="feedback"></div>
    </div>

    <div id="spellSummary" class="summary hidden">
      <h2>本轮完成</h2>
      <p id="summaryText"></p>
      <button id="restartSpell" class="primary" type="button">重新开始</button>
    </div>
  </section>

  <section id="translationSection" class="card hidden">
    <div class="toolbar">
      <div class="toolbar-left"><span id="transProgress">第 1 / 1 段</span></div>
      <div class="toolbar-right"><button class="ghost reset-progress" type="button">重置进度</button></div>
    </div>

    <div id="transArea">
      <p id="englishText" class="english"></p>
      <div class="actions">
        <button id="transToggle" class="secondary" type="button">显示翻译</button>
        <button id="prevTrans" class="ghost" type="button">上一个</button>
        <button id="nextTrans" class="primary" type="button">下一个</button>
      </div>
      <div id="translationText" class="translation hidden"></div>
      <div id="transFeedback" class="feedback"></div>
    </div>

    <div id="transDone" class="summary hidden">
      <h2>已完成</h2>
      <p>全部语料已浏览完毕。</p>
      <button id="restartTrans" class="primary" type="button">重新开始</button>
    </div>
  </section>
</main>

<footer class="site-footer">本站内容仅供参考</footer>

A plugged orifice in the U tube would be the most likely problem.|U形管中的小孔堵塞是最可能的问题。
This plugged orifice would prevent oil from returning to the compressor.|该小孔堵塞会阻止油返回压缩机。
An accumulator is inexpensive and can be added to almost any system that has experienced compressor slugging.|气液分离器价格低廉，几乎可以添加到任何经历过压缩机液击的系统中。
The cause of the slugging should still be determined and corrected if possible.|但仍应确定液击原因并尽可能纠正。
Systems that run under low load conditions may be a good place to add an accumulator.|低负荷条件下运行的系统可能是添加气液分离器的合适场合。
Parker recommends that the accumulator is replaced when a compressor is being replaced.|Parker建议在更换压缩机时更换气液分离器。
Contaminated oil from the old compressor may be in the old accumulator.|旧压缩机中的污染油可能存在于旧气液分离器中。
Also, a considerable amount of oil may still be in the old accumulator.|此外，旧气液分离器中可能仍存有相当数量的油。
This oil combined with the oil from the new compressor may create an oil overcharge.|这些油与新压缩机的油混合可能造成油量过多。
Proper accumulator sizing is important when replacing or adding.|更换或添加气液分离器时，正确选型很重要。
The pressure drop across the accumulator should be kept as low as possible.|气液分离器上的压降应尽可能低。
The accumulator's internal volume must be sufficient.|气液分离器的内部容积必须足够。
On a heat pump system with a fixed metering device the accumulator should be capable of holding 70% of the system charge.|对于采用固定节流装置的热泵系统，气液分离器应能容纳系统充注量的70%。
In a TXV system, the accumulator should be able to handle 50% of the system charge.|在TXV系统中，气液分离器应能处理系统充注量的50%。
Refer to sizing charts for proper sizing.|请参考选型图表进行正确选型。
The accumulator should never be sized by connection sizes [2].|气液分离器绝不应按连接管尺寸选型[2]。
While refrigerant boils inside the tubes of most commercial evaporators, in one important class of liquid-chilling evaporator the refrigerant boils outside the tubes.|虽然大多数商用蒸发器中制冷剂在管内沸腾，但在某一类重要的液体冷却蒸发器中，制冷剂在管外沸腾。
This type of evaporator is standard in centrifugal compressor applications.|这种蒸发器在离心式压缩机应用中很常见。
Sometimes such an evaporator is used in conjunction with reciprocating compressors, but in such applications provision must be made for returning oil to the compressor.|有时这种蒸发器与往复式压缩机配合使用，但在这种应用中必须采取措施使油返回压缩机。
In the evaporators where refrigerant boils in the tubes, the velocity of the refrigerant vapor is maintained high enough to carry oil back to the compressor [3].|在制冷剂于管内沸腾的蒸发器中，制冷剂蒸气的速度要保持足够高，以便将油带回压缩机[3]。
Water/lithium bromide is an absorption working fluid which has been used widely since 1950s when the technology was pioneered by several manufacturers in the U.S.|水/溴化锂是一种吸收式工质，自20世纪50年代几家美国制造商开创该技术以来已被广泛使用。
This working fluid utilizes water as the refrigerant and is therefore limited to refrigeration temperatures above 0°C.|该工质用水作为制冷剂，因此限于0°C以上的制冷温度。
Absorption machines based on water/lithium bromide are typically configured as water chillers for air conditioning systems in large buildings.|基于水/溴化锂的吸收式机组通常配置为大型建筑空调系统的冷水机组。
Machines are available in sizes ranging from 10 to 1500 Ton (Note: Ton is a unit of refrigeration capacity, 1Ton = 12000Btu/h = 3.517kW).|机组容量范围为10至1500冷吨（注：冷吨是制冷量单位，1冷吨=12000Btu/h=3.517kW）。
The coefficient of performance (COP) of these machines, defined as the refrigeration capacity divided by the driving heat input, typically varies over the range 0.7 < COP < 1.2 depending on the particular cycle configuration.|这些机组的性能系数（COP）定义为制冷量除以驱动热输入，通常随具体循环配置在0.7<COP<1.2范围内变化。
These machines have a reputation for consistent, dependable service among mechanical room operators.|在机房操作人员中，这些机组以服务稳定可靠著称。
The main competing technology is vapor compression chillers and choice between the two depends strongly on economic factors [4].|主要竞争技术是蒸气压缩式冷水机组，两者之间的选择在很大程度上取决于经济因素[4]。
`;

const CORPUS = CORPUS_RAW.trim().split("\n").map(line => {
  const [e, z] = line.split("|");
  return { e: e.trim(), z: z.trim() };
});

/* ========== 状态与工具 ========== */
const SPELL_KEY = "englishLearn.spell.v3";
const TRANS_KEY = "englishLearn.trans.v3";
const MODE_KEY = "englishLearn.mode.v3";

let spellState, transState, currentMode = "spelling";
let spellLocked = false;
let phoneticVisible = false;
let answerVisible = false;
let translationVisible = false;

function safeParse(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
function normalizeAnswer(value) {
  let text = String(value).trim();
  if (!STRICT_MODE) text = text.toLowerCase().replace(/\s+/g, " ");
  return text;
}
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function defaultSpellState() {
  return {
    order: WORDS.map((_, i) => i),
    index: 0,
    correct: 0,
    wrongAttempts: 0,
    skipped: 0,
    completed: false,
    random: false,
    correctPositions: []
  };
}
function loadSpellState() {
  const saved = safeParse(SPELL_KEY, null);
  if (saved && Array.isArray(saved.order) && saved.order.length === WORDS.length) {
    const index = Number.isInteger(saved.index) ? saved.index : 0;
    return {
      order: saved.order,
      index: Math.max(0, Math.min(index, WORDS.length - 1)),
      correct: Number(saved.correct) || 0,
      wrongAttempts: Number(saved.wrongAttempts) || 0,
      skipped: Number(saved.skipped) || 0,
      completed: Boolean(saved.completed),
      random: Boolean(saved.random),
      correctPositions: Array.isArray(saved.correctPositions) ? saved.correctPositions : []
    };
  }
  return defaultSpellState();
}
function defaultTransState() { return { index: 0, completed: false }; }
function loadTransState() {
  const saved = safeParse(TRANS_KEY, null);
  if (saved && Number.isInteger(saved.index) && saved.index >= 0 && saved.index < CORPUS.length) {
    return { index: saved.index, completed: Boolean(saved.completed) };
  }
  return defaultTransState();
}
function saveSpellState() { saveJSON(SPELL_KEY, spellState); }
function saveTransState() { saveJSON(TRANS_KEY, transState); }

/* ========== 单词模式 ========== */
function setSpellFeedback(text, type) {
  const el = document.getElementById("feedback");
  el.textContent = text || "";
  el.className = "feedback" + (type ? " " + type : "");
}

function renderSpell(focusInput) {
  const progressEl = document.getElementById("spellProgress");
  const playArea = document.getElementById("spellPlayArea");
  const summaryEl = document.getElementById("spellSummary");
  const randomToggle = document.getElementById("randomToggle");
  const meaningMain = document.getElementById("meaningMain");
  const phoneticTip = document.getElementById("phoneticTip");
  const answerTip = document.getElementById("answerTip");
  const input = document.getElementById("spellInput");
  const submitBtn = document.getElementById("submitSpell");
  const phoneticBtn = document.getElementById("showPhonetic");
  const answerBtn = document.getElementById("showAnswer");
  const prevBtn = document.getElementById("prevSpell");
  const nextBtn = document.getElementById("nextSpell");

  randomToggle.checked = Boolean(spellState.random);

  if (spellState.completed) {
    progressEl.textContent = "已完成 " + WORDS.length + " / " + WORDS.length;
    playArea.classList.add("hidden");
    summaryEl.classList.remove("hidden");
    document.getElementById("summaryText").textContent =
      "正确 " + spellState.correct + " 个，错误尝试 " + spellState.wrongAttempts + " 次，跳过 " + spellState.skipped + " 个。";
    return;
  }

  playArea.classList.remove("hidden");
  summaryEl.classList.add("hidden");

  const word = WORDS[spellState.order[spellState.index]];
  const answered = spellState.correctPositions.includes(spellState.index);
  progressEl.textContent = "第 " + (spellState.index + 1) + " / " + WORDS.length + " 个";
  meaningMain.textContent = word.m;
  phoneticTip.textContent = word.p;
  answerTip.textContent = word.w;
  phoneticTip.classList.toggle("hidden", !phoneticVisible);
  answerTip.classList.toggle("hidden", !(answerVisible || answered));
  phoneticBtn.textContent = phoneticVisible ? "隐藏音标提示" : "查看音标提示";
  answerBtn.textContent = answerVisible || answered ? "隐藏答案" : "查看答案";

  input.disabled = answered || spellLocked;
  submitBtn.disabled = answered || spellLocked;
  phoneticBtn.disabled = answered || spellLocked;
  answerBtn.disabled = answered || spellLocked;
  prevBtn.disabled = spellLocked || spellState.index === 0;
  nextBtn.disabled = spellLocked;

  if (answered) {
    setSpellFeedback("该题已答对，可点击“下一个”继续。", "success");
  }

  if (focusInput && !answered) setTimeout(() => input.focus(), 0);
}

function startSpellRound() {
  const order = WORDS.map((_, i) => i);
  if (spellState.random) shuffle(order);
  spellState = {
    order,
    index: 0,
    correct: 0,
    wrongAttempts: 0,
    skipped: 0,
    completed: false,
    random: Boolean(spellState.random),
    correctPositions: []
  };
  spellLocked = false;
  phoneticVisible = false;
  answerVisible = false;
  document.getElementById("spellInput").value = "";
  document.getElementById("spellInput").disabled = false;
  saveSpellState();
  renderSpell(true);
  setSpellFeedback("", "");
}

function goNextSpell(bySkip) {
  if (spellState.completed || spellLocked) return;
  const answered = spellState.correctPositions.includes(spellState.index);
  if (bySkip && !answered) spellState.skipped += 1;
  if (spellState.index + 1 >= WORDS.length) {
    spellState.completed = true;
  } else {
    spellState.index += 1;
  }
  spellLocked = false;
  phoneticVisible = false;
  answerVisible = false;
  document.getElementById("spellInput").value = "";
  document.getElementById("spellInput").disabled = false;
  saveSpellState();
  setSpellFeedback(bySkip ? "已跳过当前单词。" : "", bySkip ? "info" : "");
  renderSpell(true);
}

function goPrevSpell() {
  if (spellState.completed || spellLocked) return;
  if (spellState.index <= 0) {
    setSpellFeedback("已经是第一个单词。", "info");
    return;
  }
  spellState.index -= 1;
  phoneticVisible = false;
  answerVisible = false;
  document.getElementById("spellInput").value = "";
  document.getElementById("spellInput").disabled = false;
  spellLocked = false;
  saveSpellState();
  setSpellFeedback("已返回上一个单词。", "info");
  renderSpell(true);
}

function handleSpellSubmit() {
  if (spellLocked || spellState.completed) return;
  if (spellState.correctPositions.includes(spellState.index)) return;

  const input = document.getElementById("spellInput");
  const raw = input.value;

  if (!normalizeAnswer(raw)) {
    setSpellFeedback("请输入单词后再提交。", "info");
    input.focus();
    return;
  }

  const word = WORDS[spellState.order[spellState.index]];
  const isCorrect = normalizeAnswer(raw) === normalizeAnswer(word.w);

  if (isCorrect) {
    if (!spellState.correctPositions.includes(spellState.index)) {
      spellState.correctPositions.push(spellState.index);
      spellState.correct += 1;
    }
    spellLocked = true;
    input.disabled = true;
    phoneticVisible = false;
    answerVisible = false;
    setSpellFeedback("回答正确", "success");
    saveSpellState();
    setTimeout(() => {
      if (spellState.index + 1 >= WORDS.length) {
        spellState.completed = true;
        spellLocked = false;
        saveSpellState();
        renderSpell(false);
      } else {
        spellState.index += 1;
        spellLocked = false;
        input.disabled = false;
        input.value = "";
        setSpellFeedback("", "");
        saveSpellState();
        renderSpell(true);
      }
    }, 800);
  } else {
    spellState.wrongAttempts += 1;
    answerVisible = true;
    saveSpellState();
    setSpellFeedback("拼写错误，正确答案是：" + word.w, "error");
    input.value = "";
    input.focus();
    renderSpell(false);
    setSpellFeedback("拼写错误，正确答案是：" + word.w, "error");
  }
}

/* ========== 语料模式 ========== */
function setTransFeedback(text, type) {
  const el = document.getElementById("transFeedback");
  el.textContent = text || "";
  el.className = "feedback" + (type ? " " + type : "");
}

function renderTrans() {
  const progressEl = document.getElementById("transProgress");
  const area = document.getElementById("transArea");
  const done = document.getElementById("transDone");
  const englishEl = document.getElementById("englishText");
  const translationEl = document.getElementById("translationText");
  const toggleBtn = document.getElementById("transToggle");
  const prevBtn = document.getElementById("prevTrans");

  if (transState.completed) {
    progressEl.textContent = "已完成 " + CORPUS.length + " / " + CORPUS.length + " 段";
    area.classList.add("hidden");
    done.classList.remove("hidden");
    return;
  }

  area.classList.remove("hidden");
  done.classList.add("hidden");
  const item = CORPUS[transState.index];
  progressEl.textContent = "第 " + (transState.index + 1) + " / " + CORPUS.length + " 段";
  englishEl.textContent = item.e;
  translationEl.textContent = item.z;
  translationEl.classList.toggle("hidden", !translationVisible);
  toggleBtn.textContent = translationVisible ? "隐藏翻译" : "显示翻译";
  prevBtn.disabled = transState.index === 0;
}

function handleTransToggle() {
  if (transState.completed) return;
  translationVisible = !translationVisible;
  renderTrans();
  setTransFeedback(translationVisible ? "已显示翻译。" : "已隐藏翻译。", "info");
}

function handlePrevTrans() {
  if (transState.completed) {
    transState.completed = false;
    transState.index = CORPUS.length - 1;
    translationVisible = false;
    saveTransState();
    renderTrans();
    setTransFeedback("已返回上一段。", "info");
    return;
  }
  if (transState.index <= 0) {
    setTransFeedback("已经是第一段语料。", "info");
    return;
  }
  transState.index -= 1;
  translationVisible = false;
  saveTransState();
  renderTrans();
  setTransFeedback("已返回上一段。", "info");
}

function handleNextTrans() {
  if (transState.completed) return;
  if (transState.index + 1 >= CORPUS.length) {
    transState.completed = true;
    translationVisible = false;
    saveTransState();
    renderTrans();
    setTransFeedback("全部语料已完成。", "success");
  } else {
    transState.index += 1;
    translationVisible = false;
    saveTransState();
    renderTrans();
    setTransFeedback("已切换到下一段。", "info");
  }
}

function restartTrans() {
  transState = defaultTransState();
  translationVisible = false;
  saveTransState();
  renderTrans();
  setTransFeedback("已重新开始语料翻译。", "info");
}

/* ========== 模式切换与重置 ========== */
function setMode(mode) {
  currentMode = mode === "translation" ? "translation" : "spelling";
  try { localStorage.setItem(MODE_KEY, currentMode); } catch {}
  const spellingSection = document.getElementById("spellingSection");
  const translationSection = document.getElementById("translationSection");
  const spellingBtn = document.getElementById("modeSpelling");
  const translationBtn = document.getElementById("modeTranslation");

  if (currentMode === "spelling") {
    spellingSection.classList.remove("hidden");
    translationSection.classList.add("hidden");
    spellingBtn.classList.add("active");
    translationBtn.classList.remove("active");
    renderSpell(false);
  } else {
    spellingSection.classList.add("hidden");
    translationSection.classList.remove("hidden");
    spellingBtn.classList.remove("active");
    translationBtn.classList.add("active");
    renderTrans();
  }
}

function resetAllProgress() {
  try {
    localStorage.removeItem(SPELL_KEY);
    localStorage.removeItem(TRANS_KEY);
  } catch {}
  spellState = defaultSpellState();
  transState = defaultTransState();
  spellLocked = false;
  phoneticVisible = false;
  answerVisible = false;
  translationVisible = false;
  document.getElementById("spellInput").value = "";
  document.getElementById("spellInput").disabled = false;
  renderSpell(true);
  renderTrans();
  setSpellFeedback("进度已重置。", "info");
  setTransFeedback("进度已重置。", "info");
}

/* ========== 初始化 ========== */
function init() {
  spellState = loadSpellState();
  transState = loadTransState();
  const savedMode = (() => {
    try { return localStorage.getItem(MODE_KEY); } catch { return null; }
  })();

  document.getElementById("modeSpelling").addEventListener("click", () => setMode("spelling"));
  document.getElementById("modeTranslation").addEventListener("click", () => setMode("translation"));

  document.getElementById("submitSpell").addEventListener("click", handleSpellSubmit);
  document.getElementById("spellInput").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      handleSpellSubmit();
    }
  });

  document.getElementById("showPhonetic").addEventListener("click", () => {
    if (spellState.completed || spellLocked) return;
    if (spellState.correctPositions.includes(spellState.index)) return;
    phoneticVisible = !phoneticVisible;
    renderSpell(false);
    document.getElementById("spellInput").focus();
  });

  document.getElementById("showAnswer").addEventListener("click", () => {
    if (spellState.completed || spellLocked) return;
    if (spellState.correctPositions.includes(spellState.index)) return;
    answerVisible = !answerVisible;
    renderSpell(false);
    document.getElementById("spellInput").focus();
  });

  document.getElementById("prevSpell").addEventListener("click", goPrevSpell);
  document.getElementById("nextSpell").addEventListener("click", () => goNextSpell(true));

  document.getElementById("randomToggle").addEventListener("change", (event) => {
    spellState.random = event.target.checked;
    phoneticVisible = false;
    answerVisible = false;
    startSpellRound();
    setSpellFeedback(spellState.random ? "已切换为随机顺序，并重新开始本轮。" : "已切换为顺序模式，并重新开始本轮。", "info");
  });

  document.getElementById("restartSpell").addEventListener("click", () => {
    startSpellRound();
    setSpellFeedback("已重新开始本轮。", "info");
  });

  document.getElementById("transToggle").addEventListener("click", handleTransToggle);
  document.getElementById("prevTrans").addEventListener("click", handlePrevTrans);
  document.getElementById("nextTrans").addEventListener("click", handleNextTrans);
  document.getElementById("restartTrans").addEventListener("click", restartTrans);

  document.querySelectorAll(".reset-progress").forEach(button => {
    button.addEventListener("click", resetAllProgress);
  });

  setMode(savedMode === "translation" ? "translation" : "spelling");
}

init();
</script>
</body>
</html>
